{% extends "base.html" %}

{% block title %}Update Student | StudentMS{% endblock %}

{% block content %}
<div class="auth-shell" style="max-width: 760px;">
    <section class="panel form-panel">
        <div class="panel-head">
            <div>
                <h2>Update Student</h2>
                <p>Edit the student profile details using the existing update workflow.</p>
            </div>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="form-grid">
                <div class="field full">
                    <label for="name">Student Name</label>
                    <input id="name" type="text" name="name" value="{{ student.name }}" required>
                </div>
                <div class="field">
                    <label for="student_id">Student ID</label>
                    <input id="student_id" type="text" name="student_id" value="{{ student.student_id }}" required>
                </div>
                <div class="field">
                    <label for="gpa">GPA</label>
                    <input id="gpa" type="number" step="0.01" name="gpa" value="{{ student.gpa }}" required>
                </div>
                <div class="field">
                    <label for="attendance">Attendance</label>
                    <input id="attendance" type="number" step="0.01" name="attdendance" value="{{ student.attendance }}" required>
                </div>
                <div class="field">
                    <label for="avg_grade">Average Grade</label>
                    <input id="avg_grade" type="number" step="0.01" name="avg_grade" value="{{ student.avg_grade }}" required>
                </div>
            </div>
            <div class="button-row" style="margin-top: 18px;">
                <button class="btn btn-primary" type="submit">Save Changes</button>
                <a class="btn btn-outline" href="{% url 'view' %}">Cancel</a>
            </div>
        </form>
    </section>
</div>
{% endblock %}
