{% extends "base.html" %}

{% block title %}Delete Student | StudentMS{% endblock %}

{% block content %}
<div class="auth-shell" style="max-width: 620px;">
    <section class="panel empty-state">
        <h2>Delete Confirmation</h2>
        <p>Are you sure you want to delete <strong>{{ student.name }}</strong> with student ID <strong>{{ student.student_id }}</strong>?</p>
        <p class="muted">This action cannot be undone.</p>

        <form method="POST" style="margin-top: 18px;">
            {% csrf_token %}
            <div class="button-row" style="justify-content: center;">
                <button class="btn btn-danger" type="submit">Yes, Delete</button>
                <a class="btn btn-outline" href="{% url 'view' %}">Cancel</a>
            </div>
        </form>
    </section>
</div>
{% endblock %}
