{% extends "base.html" %}

{% block title %}Logout | Student Dashboard{% endblock %}

{% block content %}
<div class="auth-shell" style="max-width: 620px;">
    <section class="panel empty-state">
        <h2>Logout</h2>
        <p>Are you sure you want to end your current session?</p>

        <form method="POST" action="{% url 'logout' %}" style="margin-top: 18px;">
            {% csrf_token %}
            <div class="button-row" style="justify-content: center;">
                <button type="submit" class="btn btn-primary">Logout</button>
                <a href="{% url 'view' %}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </section>
</div>
{% endblock %}
